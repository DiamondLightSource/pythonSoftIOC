name: Periodic

on:
  workflow_dispatch:
  schedule:
    # Run weekly to check URL links still resolve
    - cron: "0 8 * * WED"

jobs:
  linkcheck:
    uses: ./.github/workflows/_tox.yml
    with:
      tox: docs -- -b linkcheck

  # Check that the master branches of various upstream dependencies are
  # still compatible when used together
  master_branch_test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0
          # iocStats is needed to build the extension
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install master versions
        run: |
          uv venv
          uv pip install --pre setuptools setuptools_scm setuptools_dso \
            git+https://github.com/epics-base/p4p.git \
            git+https://github.com/epics-base/pvxs.git \
            git+https://github.com/epics-base/epicscorelibs.git \
            git+https://github.com/DiamondLightSource/aioca \
            git+https://github.com/DiamondLightSource/cothread
          # Build against the master epicscorelibs installed above
          uv pip install --no-build-isolation -e . --group dev
          uv pip freeze

      - name: Run tests
        run: uv run --no-sync pytest
